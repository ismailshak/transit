version: "2"

linters:
  default: none
  enable:
    - errcheck    # unchecked error return values
    - errorlint   # %s/%v on errors, type assertions that skip the wrap chain
    - govet       # go vet's suite
    - ineffassign # assignments never read
    - staticcheck # bugs, deprecated API use, simplifications
    - unused      # dead code
    - gocritic    # broader diagnostics: suspicious appends, if/else chains, etc.
    - bodyclose   # HTTP response bodies that are opened but never closed
    - noctx       # HTTP requests built without a context.Context
    - unconvert   # redundant type conversions
    - misspell    # typos in comments and strings
  settings:
    errcheck:
      # Read-side closers only since nothing is buffered on a reader, so the error
      # carries no information and there's no action to take.
      exclude-functions:
        - (io.ReadCloser).Close
        - (*database/sql.Rows).Close
        - (*archive/zip.ReadCloser).Close

formatters:
  enable:
    - gofmt
